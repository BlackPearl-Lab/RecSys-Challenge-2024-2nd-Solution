base_config: ./config/base_config/
base_expid: DIN_demo
dataset_id: V1

dataset_config:
    V1:
        data_root: ./dataset/nn_data
        data_format: csv
        article_data: ./features/nn_data/article/article_feats.parquet
        train_data: ./features/nn_data/imp/train_imp.parquet
        valid_data: ./features/nn_data/imp/valid_imp.parquet
        test_data: ./features/nn_data/imp/test_imp.parquet
        train_history: ./features/nn_data/history/train_history.parquet
        valid_history: ./features/nn_data/history/valid_history.parquet
        test_history: ./features/nn_data/history/test_history.parquet
